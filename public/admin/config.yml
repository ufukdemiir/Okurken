backend:
  name: github
  # ÖNEMLİ: "kullanici-adi/depo-adi" kısmını kendi GitHub kullanıcı adınız ve
  # deponuzun adıyla değiştirin (ör. "ufukdemir/okurken").
  repo: ufukdemiir/Okurken
  branch: main
  # Bu URL, README.md içindeki "Decap CMS için GitHub OAuth Kurulumu"
  # bölümünde kendi Cloudflare Worker adresinizle değiştirilmelidir.
  base_url: https://okurken-oauth.KULLANICI-ADI.workers.dev
  auth_endpoint: auth

# Yayınlama: her kayıt doğrudan `branch`e commit edilir. Taslak/inceleme
# akışı isteniyorsa aşağıdaki satırı etkinleştirin:
# publish_mode: editorial_workflow

locale: "tr"

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://ufukdemiir.github.io/Okurken
display_url: https://ufukdemiir.github.io/Okurken
logo_url: /favicon.svg

collections:
  - name: "books"
    label: "Kitaplar"
    label_singular: "Kitap"
    folder: "src/content/books"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{author}} ({{status}})"
    sortable_fields: ["title", "author", "startDate", "endDate", "rating"]
    view_filters:
      - label: "Okunuyor"
        field: status
        pattern: "reading"
      - label: "Okundu"
        field: status
        pattern: "completed"
      - label: "Okunacak"
        field: status
        pattern: "want-to-read"
      - label: "Yarım Bırakıldı"
        field: status
        pattern: "dropped"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yazar", name: "author", widget: "string" }
      - { label: "Yayınevi", name: "publisher", widget: "string", required: false }
      - { label: "Sayfa Sayısı", name: "pageCount", widget: "number", value_type: "int", required: false, min: 1 }
      - { label: "Başlangıç Tarihi", name: "startDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Bitiş Tarihi", name: "endDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - label: "Durum"
        name: "status"
        widget: "select"
        options:
          - { label: "Okunuyor", value: "reading" }
          - { label: "Okundu", value: "completed" }
          - { label: "Okunacak", value: "want-to-read" }
          - { label: "Yarım Bırakıldı", value: "dropped" }
      - { label: "Puan (1-10)", name: "rating", widget: "number", value_type: "int", min: 1, max: 10, required: false }
      - {
          label: "Türler",
          name: "genres",
          widget: "list",
          field: { label: "Tür", name: "genre", widget: "string" },
          required: false,
          hint: "Serbest metin — istediğiniz herhangi bir türü yazabilirsiniz (ör. Dini Kitaplar, Dil Eğitimi, Yabancı Dil, Şiir). Sabit bir liste değildir.",
        }
      - {
          label: "Eser Adı (birden fazla ciltse)",
          name: "seriesTitle",
          widget: "string",
          required: false,
          hint: "Yalnızca birden fazla ciltten oluşan eserler için doldurun. Tüm ciltlerde AYNI yazılmalı (ör. 'Savaş ve Barış'). Kitabın kendi başlığına cilt numarasını eklemenize gerek yok, otomatik gösterilir.",
        }
      - {
          label: "Cilt Numarası",
          name: "volumeNumber",
          widget: "number",
          value_type: "int",
          min: 1,
          required: false,
          hint: "Yalnızca 'Eser Adı' doldurulduysa anlamlıdır.",
        }
      - label: "Notlar"
        name: "notes"
        widget: "list"
        required: false
        field: { label: "Not", name: "note", widget: "text" }
      - label: "Alıntılar"
        name: "quotes"
        widget: "list"
        required: false
        fields:
          - { label: "Metin", name: "text", widget: "text" }
          - { label: "Sayfa", name: "page", widget: "number", value_type: "int", required: false, min: 1 }
      - { label: "İnceleme (Markdown)", name: "body", widget: "markdown", required: false }
      - { label: "Taslak", name: "draft", widget: "boolean", default: false, required: false }

  - name: "blog"
    label: "Blog"
    label_singular: "Yazı"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["publishDate", "title"]
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - {
          label: "Kısa Özet",
          name: "excerpt",
          widget: "text",
          required: false,
          hint: "Listeleme ve arama motoru açıklaması için. Boş bırakılırsa yazının ilk cümlelerinden otomatik üretilir.",
        }
      - { label: "Etiketler", name: "tags", widget: "list", field: { label: "Etiket", name: "tag", widget: "string" }, required: false }
      - { label: "Yazı (Markdown)", name: "body", widget: "markdown" }
      - { label: "Taslak", name: "draft", widget: "boolean", default: false, required: false }

  - name: "settings"
    label: "Site Ayarları"
    files:
      - name: "main"
        label: "Genel Ayarlar"
        file: "src/data/site.json"
        fields:
          - { label: "Okur Adı", name: "readerName", widget: "string" }
          - { label: "Baş Harfler (Avatar)", name: "avatarInitials", widget: "string" }
          - { label: "Kısa Slogan", name: "tagline", widget: "string" }
          - { label: "Biyografi", name: "bio", widget: "text" }
          - { label: "Site Açıklaması (SEO)", name: "siteDescription", widget: "text" }
          - { label: "Hedef Yılı", name: "goalYear", widget: "number", value_type: "int" }
          - { label: "Yıllık Okuma Hedefi (kitap)", name: "yearlyGoal", widget: "number", value_type: "int", min: 1 }
          - label: "Sosyal Bağlantılar"
            name: "social"
            widget: "object"
            fields:
              - { label: "Web Sitesi", name: "website", widget: "string", required: false }
              - { label: "GitHub linki", name: "github", widget: "string", required: false }
              - { label: "LinkedIn linki", name: "linkedin", widget: "string", required: false }
              - { label: "Pinterest linki", name: "pinterest", widget: "string", required: false }
              - { label: "E-posta", name: "email", widget: "string", required: false }
